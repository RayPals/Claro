name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc make python3
      - name: Build
        run: make
      - name: Run tests
        run: ./claro test
      - name: Run current release validation
        run: ./claro validate
      - name: Validate typecheck diagnostics
        run: python3 tools/validate_typecheck_diagnostics.py
      - name: Validate version convention
        run: python3 tools/validate_version_convention.py
      - name: Validate package security
        run: python3 tools/validate_package_security.py
      - name: Validate compiler warnings
        run: python3 tools/validate_compiler_warnings.py
      - name: Validate trusted command documentation
        run: python3 tools/validate_trusted_command_docs.py
      - name: Validate documentation and release status
        run: python3 tools/validate_documentation_status.py
      - name: Validate VC6 Windows 98 build settings
        run: python3 tools/validate_msvc6_source.py
      - name: Validate single-file C89 build
        run: python3 tools/validate_c89.py
      - name: Validate executable learning path
        run: python3 tools/validate_learning_syntax.py
      - name: Validate diagnostics, error guide and learner pilot code
        run: |
          python3 tools/validate_error_locations.py
          python3 tools/validate_error_guide.py
          python3 tools/validate_learner_pilot.py
          python3 tools/validate_resource_guards.py
      - name: Validate memory and malformed-input reliability
        run: python3 tools/validate_reliability.py
      - name: Validate CI workflow coverage
        run: python3 tools/validate_ci_workflow.py
      - name: Check lessons
        run: |
          ./claro check lessons/01_hello.claro
          ./claro check lessons/03_variables.claro
          ./claro check lessons/08_functions.claro
      - name: Validate RC3
        run: python3 tools/validate_rc3.py
