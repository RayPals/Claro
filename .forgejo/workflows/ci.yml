name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc make python3
      - name: Build
        run: make
      - name: Run tests
        run: ./claro test
      - name: Check lessons
        run: |
          ./claro check lessons/01_hello.claro
          ./claro check lessons/03_variables.claro
          ./claro check lessons/08_functions.claro
      - name: Validate RC3
        run: python3 tools/validate_rc3.py
